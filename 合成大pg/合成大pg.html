<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>合成大苹果</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:radial-gradient(circle at 50% 30%, #2b2b4a 0%, #16162a 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #wrap{position:relative;}
  #cv{display:block;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);touch-action:none;cursor:pointer;}

  #gate{
    position:fixed;inset:0;z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%, #2b2b4a 0%, #16162a 100%);
  }
  #gate .box{text-align:center;color:#fff;}
  #gate .title{font-size:22px;margin-bottom:20px;}
  #gate input{
    width:240px;padding:12px 16px;border-radius:10px;border:none;
    font-size:16px;outline:none;text-align:center;
  }
  #gate .err{color:#ff6b6b;height:22px;margin-top:8px;font-size:14px;}
  #gate button{
    margin-top:6px;padding:12px 40px;border-radius:10px;border:none;
    background:linear-gradient(180deg,#69db7c,#37b24d);color:#fff;
    font-size:17px;font-weight:bold;cursor:pointer;
  }
</style>
</head>
<body>

<!-- ===== 密码门（不想用就整段删掉） ===== -->
<div id="gate">
  <div class="box">
    <div class="title">🔒 请输入访问密码</div>
    <input id="pw" type="password" placeholder="密码">
    <div class="err" id="err"></div>
    <button id="go">进入</button>
  </div>
</div>
<script>
(function(){
  // ★★★ 改这里：设置你的密码 ★★★
  const PASSWORD = 'smPG';
  // ★★★ 是否记住验证状态（同一浏览器只输一次） ★★★
  const REMEMBER = true;

  const gate = document.getElementById('gate');
  const pw   = document.getElementById('pw');
  const err  = document.getElementById('err');
  const go   = document.getElementById('go');

  if (REMEMBER && localStorage.getItem('wg_ok') === '1'){
    gate.style.display = 'none';
  }

  function tryGo(){
    if (pw.value === PASSWORD){
      if (REMEMBER) localStorage.setItem('wg_ok', '1');
      gate.style.display = 'none';
    } else {
      err.textContent = '密码错误';
      pw.value = '';
      pw.focus();
    }
  }
  go.onclick = tryGo;
  pw.onkeydown = e => { if (e.key === 'Enter') tryGo(); };
  pw.focus();
})();
</script>
<!-- ===== 密码门结束 ===== -->


<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
'use strict';

/* ================= 配置区 ================= */
const W = 480, H = 760;

const GRAVITY          = 2200;  // 重力
const RESTITUTION      = 1.20;  // 球球弹性
const WALL_RESTITUTION = 0.28;  // 撞墙弹性
const FRICTION         = 0.08;  // 摩擦
const ITER             = 6;     // 约束迭代次数
const FIXED_DT         = 1/120; // 物理步长
const MAX_SPEED        = 3200;  // 速度上限

const ANG_DAMP_AIR     = 0.999; // 空中角速度衰减
const ANG_DAMP_GROUND  = 0.94;  // 地面角速度衰减
const SPIN_FROM_FRICTION = 0.35;// 摩擦力转化成旋转的强度

const DANGER_Y         = 150;
const OVER_LIMIT       = 1.5;
const OVER_SPEED       = 120;
const DROP_CD          = 0.32;
const SPAWN_Y          = 70;

/* 水果链：
   r    = 半径（碰撞和显示都用它，圆形）
   c    = 色块颜色（没图时用）
   img  = 图片路径，留空字符串就纯色块。
          抠好的透明 PNG 会被圆形裁剪，不会露出方形边缘。
*/
const FRUITS = [
  { r: 16,  c: '#ff7a9c', img: './img/img10.png' },
  { r: 23,  c: '#ffa94d', img: './img/img5.png' },
  { r: 31,  c: '#ffd93d', img: './img/img6.png' },
  { r: 40,  c: '#8ce99a', img: './img/img7.png' },
  { r: 50,  c: '#74c0fc', img: './img/img4.png' },
  { r: 62,  c: '#b197fc', img: './img/img3.png' },
  { r: 75,  c: '#ff8787', img: './img/img1.png' },
  { r: 89,  c: '#ffa94d', img: './img/img2.png' },
  { r: 104, c: '#ff6b6b', img: './img/img9.png' },
  { r: 120, c: '#69db7c', img: './img/img8.png' },
  { r: 138, c: '#51cf66', img: './img/img11.png' },
];
const SCORES    = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55];
const MAX_LEVEL = FRUITS.length - 1;
const SPAWN_W   = [0.30, 0.28, 0.22, 0.13, 0.07];
/* ========================================= */

const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('wrap');

let balls = [], particles = [];
let score = 0;
let best  = parseInt(localStorage.getItem('watermelon_best') || '0', 10);
let gameOver = false;
let aimX = W / 2;
let currentLevel = randLevel();
let dropCd = 0, overTimer = 0, shakeT = 0, time = 0;

/* ---------- 工具 ---------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
function hexToRgb(hex){ const h=hex.slice(1);
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lighten(hex,a){ const [r,g,b]=hexToRgb(hex);
  return `rgb(${Math.round(r+(255-r)*a)},${Math.round(g+(255-g)*a)},${Math.round(b+(255-b)*a)})`; }
function darken(hex,a){ const [r,g,b]=hexToRgb(hex);
  return `rgb(${Math.round(r*(1-a))},${Math.round(g*(1-a))},${Math.round(b*(1-a))})`; }
function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);     c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function randLevel(){
  let r = Math.random(), acc = 0;
  for (let i = 0; i < SPAWN_W.length; i++){
    acc += SPAWN_W[i];
    if (r <= acc) return i;
  }
  return 0;
}

/* ---------- 图片加载（有路径才加载） ---------- */
const fruitImgs = [];
FRUITS.forEach((f, i) => {
  if (!f.img){ fruitImgs[i] = null; return; }
  const img = new Image();
  img.onerror = () => { console.warn('图片加载失败，用色块回退:', f.img); fruitImgs[i] = null; };
  img.src = f.img;
  fruitImgs[i] = img;
});

/* ---------- 球 ---------- */
class Ball {
  constructor(x,y,level){
    this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.level=level;
    this.r=FRUITS[level].r;
    this.m=this.r*this.r;
    this.dead=false;
    this.dropped=false;
    this.pop=0;
    this.angle = (Math.random()-0.5) * 0.4;  // 初始轻微歪一点
    this.angVel = 0;                          // 角速度
    this.onGround = false;
  }
}

/* ---------- 物理 ---------- */
function physicsStep(dt){
  // 1. 积分
  for (let i=0;i<balls.length;i++){
    const b = balls[i];
    if (b.dead) continue;
    b.vy += GRAVITY * dt;
    if (b.vy >  MAX_SPEED) b.vy =  MAX_SPEED;
    if (b.vy < -MAX_SPEED) b.vy = -MAX_SPEED;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // 角速度更新
    b.angle += b.angVel * dt;
    b.onGround = false;
  }

  // 2. 约束迭代
  for (let iter=0; iter<ITER; iter++){
    const applyVel = (iter === 0);

    for (let i=0;i<balls.length;i++){
      const a = balls[i];
      if (a.dead) continue;
      for (let j=i+1;j<balls.length;j++){
        const b = balls[j];
        if (b.dead) continue;
        collidePair(a,b,applyVel);
      }
    }
    for (let i=0;i<balls.length;i++){
      const b = balls[i];
      if (!b.dead) collideWalls(b, applyVel);
    }
  }

  // 3. 角速度衰减
  for (let i=0;i<balls.length;i++){
    const b = balls[i];
    if (b.dead) continue;
    if (b.onGround){
      // 地面滚动：角速度趋向 vx / r
      b.angVel += (b.vx / b.r - b.angVel) * 0.35;
      b.angVel *= ANG_DAMP_GROUND;
    } else {
      b.angVel *= ANG_DAMP_AIR;
    }
    // 限制最大角速度，防止疯转
    const maxAng = 22;
    if (b.angVel >  maxAng) b.angVel =  maxAng;
    if (b.angVel < -maxAng) b.angVel = -maxAng;
  }
}

function collidePair(a,b,applyVel){
  const dx = b.x - a.x, dy = b.y - a.y;
  const rSum = a.r + b.r;
  const d2 = dx*dx + dy*dy;
  if (d2 >= rSum*rSum) return;

  let d = Math.sqrt(d2), nx, ny;
  if (d < 1e-4){ nx = 0; ny = -1; d = 1e-4; }
  else { nx = dx/d; ny = dy/d; }

  const overlap = rSum - d;
  const totalM  = a.m + b.m;
  const c = overlap / totalM;
  a.x -= nx * c * b.m;  a.y -= ny * c * b.m;
  b.x += nx * c * a.m;  b.y += ny * c * a.m;

  if (!applyVel) return;

  // 法向冲量
  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx*nx + rvy*ny;
  if (vn > 0) return;

  const invA = 1/a.m, invB = 1/b.m;
  const jn = -(1 + RESTITUTION) * vn / (invA + invB);
  a.vx -= jn * nx * invA;  a.vy -= jn * ny * invA;
  b.vx += jn * nx * invB;  b.vy += jn * ny * invB;

  // 切向摩擦
  const tx = -ny, ty = nx;
  const vt = rvx*tx + rvy*ty;
  const jt = -vt * FRICTION / (invA + invB);
  a.vx -= jt * tx * invA;  a.vy -= jt * ty * invA;
  b.vx += jt * tx * invB;  b.vy += jt * ty * invB;

  // 摩擦力转化为旋转
  const spin = -vt * SPIN_FROM_FRICTION / (a.r + b.r);
  a.angVel -= spin * 0.5;
  b.angVel += spin * 0.5;
}

function collideWalls(b, applyVel){
  const e = WALL_RESTITUTION;
  if (b.x - b.r < 0){
    b.x = b.r;
    if (applyVel && b.vx < 0){
      b.vx = -b.vx * e;
      b.angVel = -b.angVel * 0.6;
    }
  } else if (b.x + b.r > W){
    b.x = W - b.r;
    if (applyVel && b.vx > 0){
      b.vx = -b.vx * e;
      b.angVel = -b.angVel * 0.6;
    }
  }
  if (b.y + b.r > H){
    b.y = H - b.r;
    if (applyVel && b.vy > 0){
      b.vy = -b.vy * e;
      b.vx *= 0.88;
    }
    b.onGround = true;
  }
}

/* ---------- 合成 ---------- */
function checkMerges(){
  let merged = true;
  while (merged){
    merged = false;
    outer:
    for (let i=0;i<balls.length;i++){
      const a = balls[i];
      if (a.dead) continue;
      for (let j=i+1;j<balls.length;j++){
        const b = balls[j];
        if (b.dead || a.level !== b.level) continue;
        const dx = b.x-a.x, dy = b.y-a.y;
        const rr = (a.r + b.r) * 1.02;
        if (dx*dx + dy*dy < rr*rr){
          doMerge(a,b);
          merged = true;
          break outer;
        }
      }
    }
  }
}

function doMerge(a,b){
  a.dead = true;
  b.dead = true;

  const tm = a.m + b.m;
  const mx = (a.x*a.m + b.x*b.m)/tm;
  const my = (a.y*a.m + b.y*b.m)/tm;

  if (a.level < MAX_LEVEL){
    const nl = a.level + 1;
    const nb = new Ball(mx,my,nl);
    nb.vx = (a.vx + b.vx) * 0.5;
    nb.vy = (a.vy + b.vy) * 0.5;
    nb.angVel = (a.angVel + b.angVel) * 0.5;
    nb.dropped = true;
    nb.pop = 1;
    balls.push(nb);
    addScore(SCORES[nl]);
    burst(mx,my,FRUITS[nl].c, FRUITS[nl].r);
    shakeT = Math.min(shakeT + 0.08, 0.22);
  } else {
    addScore(600);
    burst(mx,my,FRUITS[MAX_LEVEL].c, FRUITS[MAX_LEVEL].r);
    shakeT = 0.35;
  }
}

function addScore(n){
  score += n;
  if (score > best){
    best = score;
    localStorage.setItem('watermelon_best', String(best));
  }
}

/* ---------- 粒子 ---------- */
function burst(x,y,color,r){
  const n = clamp(6 + Math.floor(r/5), 6, 20);
  for (let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2;
    const sp  = 90 + Math.random()*260;
    particles.push({
      x, y,
      vx: Math.cos(ang)*sp,
      vy: Math.sin(ang)*sp - 80,
      r: 2 + Math.random()*4,
      life: 1,
      color
    });
  }
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.vy += 1100*dt;
    p.x  += p.vx*dt;
    p.y  += p.vy*dt;
    p.vx *= 0.985;
    p.life -= dt*1.7;
    if (p.life <= 0) particles.splice(i,1);
  }
}

/* ---------- 游戏流程 ---------- */
function drop(){
  if (gameOver || dropCd > 0) return;
  const r = FRUITS[currentLevel].r;
  const x = clamp(aimX, r+2, W-r-2);
  const b = new Ball(x, SPAWN_Y, currentLevel);
  b.vy = 180;
  b.angVel = (Math.random()-0.5) * 3;
  b.dropped = true;
  balls.push(b);
  dropCd = DROP_CD;
  currentLevel = randLevel();
  clampAim();
}
function clampAim(){
  const r = FRUITS[currentLevel].r;
  aimX = clamp(aimX, r+4, W-r-4);
}
function checkGameOver(dt){
  let over = false;
  for (let i=0;i<balls.length;i++){
    const b = balls[i];
    if (!b.dropped) continue;
    if (b.y - b.r < DANGER_Y &&
        Math.abs(b.vy) < OVER_SPEED &&
        Math.abs(b.vx) < OVER_SPEED){
      over = true; break;
    }
  }
  if (over){
    overTimer += dt;
    if (overTimer >= OVER_LIMIT){
      gameOver = true;
      if (score > best){
        best = score;
        localStorage.setItem('watermelon_best', String(best));
      }
    }
  } else {
    overTimer = Math.max(0, overTimer - dt*2.5);
  }
}
function restart(){
  balls.length = 0;
  particles.length = 0;
  score = 0;
  gameOver = false;
  overTimer = 0;
  dropCd = 0;
  shakeT = 0;
  aimX = W/2;
  currentLevel = randLevel();
  clampAim();
}

/* ---------- 渲染 ---------- */

// 色块（以 0,0 为中心画，外面已经 rotate 过）
function drawColorBall(rr, level){
  const base = FRUITS[level].c;

  // 球体
  ctx.beginPath();
  ctx.arc(0, 0, rr, 0, Math.PI*2);
  const g = ctx.createRadialGradient(-rr*0.35, -rr*0.40, rr*0.05, 0, 0, rr*1.05);
  g.addColorStop(0,   lighten(base, 0.60));
  g.addColorStop(0.5, base);
  g.addColorStop(1,   darken(base, 0.22));
  ctx.fillStyle = g;
  ctx.fill();

  // 高光（跟着转）
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.beginPath();
  ctx.ellipse(-rr*0.34, -rr*0.38, rr*0.22, rr*0.13, -0.6, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  // 表情（跟着转，会有翻跟头效果）
  if (rr >= 20){
    const ex = rr*0.30, ey = -rr*0.06, er = Math.max(2, rr*0.085);
    ctx.fillStyle = 'rgba(55,30,30,0.78)';
    ctx.beginPath(); ctx.arc(-ex, ey, er, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( ex, ey, er, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-ex-er*0.3, ey-er*0.35, er*0.36, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( ex-er*0.3, ey-er*0.35, er*0.36, 0, Math.PI*2); ctx.fill();
  }
  if (rr >= 32){
    ctx.strokeStyle = 'rgba(55,30,30,0.5)';
    ctx.lineWidth = Math.max(1.6, rr*0.055);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, rr*0.22, rr*0.20, Math.PI*0.22, Math.PI*0.78);
    ctx.stroke();
  }
}

// 主绘制：圆形裁剪，图片不会露出方形边缘
function drawBall(x, y, r, level, pop, angle){
  const rr = r * (1 + pop*0.16);
  const img = fruitImgs[level];

  ctx.save();
  ctx.translate(x, y);

  // 阴影：单独画一个圆，避免 clip 把阴影裁掉
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, rr*0.06, rr, 0, Math.PI*2);
  ctx.shadowColor = 'rgba(0,0,0,0.22)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = 'rgba(0,0,0,0.01)';
  ctx.fill();
  ctx.restore();

  // 旋转
  ctx.rotate(angle);

  if (img && img.complete && img.naturalWidth > 0){
    // ★ 圆形裁剪：抠好的透明 PNG 不会露出正方形边缘 ★
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(img, -rr, -rr, rr*2, rr*2);
    ctx.restore();
  } else {
    drawColorBall(rr, level);
  }

  ctx.restore();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  ctx.save();
  if (shakeT > 0){
    const s = shakeT * 26;
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  // 背景
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,   '#fff8ec');
  bg.addColorStop(0.6, '#ffe9cf');
  bg.addColorStop(1,   '#ffd9b3');
  ctx.fillStyle = bg;
  ctx.fillRect(-24,-24,W+48,H+48);

  // 警戒线
  ctx.save();
  ctx.setLineDash([12,9]);
  ctx.lineWidth = 3;
  if (overTimer > 0){
    const a = 0.35 + 0.55*Math.abs(Math.sin(time*8));
    ctx.strokeStyle = `rgba(255,60,60,${a})`;
  } else {
    ctx.strokeStyle = 'rgba(255,140,120,0.45)';
  }
  ctx.beginPath();
  ctx.moveTo(0,DANGER_Y);
  ctx.lineTo(W,DANGER_Y);
  ctx.stroke();
  ctx.restore();

  // 所有球
  for (let i=0;i<balls.length;i++){
    const b = balls[i];
    if (!b.dead) drawBall(b.x,b.y,b.r,b.level,b.pop,b.angle);
  }

  // 待投放水果 + 参考线
  if (!gameOver){
    const r = FRUITS[currentLevel].r;
    const x = clamp(aimX, r+2, W-r-2);
    ctx.save();
    ctx.setLineDash([6,10]);
    ctx.strokeStyle = 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, SPAWN_Y + r);
    ctx.lineTo(x, H);
    ctx.stroke();
    ctx.restore();
    drawBall(x, SPAWN_Y, r, currentLevel, 0, Math.sin(time*2)*0.12);
  }

  // 粒子
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 分数
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(120,70,40,0.85)';
  ctx.font = 'bold 40px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText(String(score), 22, 20);
  ctx.fillStyle = 'rgba(150,110,80,0.55)';
  ctx.font = 'bold 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText('最高 ' + best, 24, 68);
  ctx.restore();

  if (gameOver) renderGameOver();
}

function renderGameOver(){
  ctx.save();
  ctx.fillStyle = 'rgba(30,20,15,0.62)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText('游戏结束', W/2, H/2 - 150);

  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 44px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText(String(score), W/2, H/2 - 60);

  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = '18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText('本局得分', W/2, H/2 - 20);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText('最高分 ' + best, W/2, H/2 + 30);

  const bw = 220, bh = 64, bx = W/2 - bw/2, by = H/2 + 90;
  const g = ctx.createLinearGradient(bx, by, bx, by+bh);
  g.addColorStop(0,'#69db7c');
  g.addColorStop(1,'#37b24d');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;
  roundRect(ctx, bx, by, bw, bh, 32);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.fillText('再来一局', W/2, by + bh/2 + 2);
  ctx.restore();
}

/* ---------- 输入 ---------- */
function toCanvasX(clientX){
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) / rect.width * W;
}
canvas.addEventListener('pointermove', e => {
  if (gameOver) return;
  aimX = toCanvasX(e.clientX);
  clampAim();
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('pointerdown', e => {
  if (gameOver) return;
  aimX = toCanvasX(e.clientX);
  clampAim();
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  if (gameOver){ restart(); return; }
  drop();
}, {passive:false});
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); drop(); }
  if (e.code === 'KeyR'){ restart(); }
  if (e.code === 'ArrowLeft'){ aimX -= 20; clampAim(); }
  if (e.code === 'ArrowRight'){ aimX += 20; clampAim(); }
});
window.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 自适应 ---------- */
let dpr = 1;
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/W, vh/H);
  const cw = Math.floor(W*scale), ch = Math.floor(H*scale);
  wrap.style.width  = cw + 'px';
  wrap.style.height = ch + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

/* ---------- 主循环 ---------- */
let prev = 0, acc = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!prev) prev = now;
  let dt = (now - prev) / 1000;
  prev = now;
  if (dt > 0.1) dt = 0.1;
  time += dt;

  if (!gameOver){
    acc += dt;
    let steps = 0;
    while (acc >= FIXED_DT && steps < 8){
      physicsStep(FIXED_DT);
      acc -= FIXED_DT;
      steps++;
    }
    if (steps >= 8) acc = 0;

    checkMerges();
    balls = balls.filter(b => !b.dead);

    if (dropCd > 0) dropCd -= dt;

    for (let i=0;i<balls.length;i++){
      const b = balls[i];
      if (b.pop > 0) b.pop = Math.max(0, b.pop - dt*5);
    }
    checkGameOver(dt);
  }

  updateParticles(dt);
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);

  render();
}

/* ---------- 启动 ---------- */
resize();
clampAim();
requestAnimationFrame(loop);

})();
</script>
